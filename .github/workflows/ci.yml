name: ci

# The repo's own checks. Both jobs call the same scripts `make ci` runs locally
# (tools/ci.sh stages, tools/smoke-docker.sh). Security gates (secret-scan, sast,
# dependency-review, leftover-grep, pr-title-lint) are rig-managed workflows next to this one.
on:
  pull_request:
  push:
    branches: [mac-tahoe, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (make ci-fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv (shellcheck / actionlint run through `uv tool run`)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install system tools
        # gjs runs tests/*_check.js, libglib2.0-bin compiles/validates the schema,
        # libxml2-utils lints the .ui files.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gjs libglib2.0-bin libxml2-utils make zip

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: make ci-fast
        run: make ci-fast

  smoke:
    name: smoke (GNOME Shell 50, ubuntu:26.04)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Unit checks (gjs 1.88), nested shell smoke, visual regression
        run: tools/smoke-docker.sh

      - name: Upload shell log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-out
          path: smoke-out/
          if-no-files-found: warn
